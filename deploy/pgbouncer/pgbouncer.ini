; PgBouncer — connection pooling in front of PostgreSQL.
;
; Why this exists
; ---------------
; Every backend replica keeps its own SQLAlchemy pool. With three replicas at 5 connections
; plus 5 overflow each, PostgreSQL would see up to 30 connections for a fleet that is
; usually handling a handful of concurrent queries — and that number grows linearly every
; time a replica is added. PostgreSQL allocates real memory per backend process, so the
; ceiling arrives sooner than people expect: `max_connections=100` is not 100 useful
; concurrent queries.
;
; PgBouncer multiplexes. The application opens connections to PgBouncer, PgBouncer keeps a
; small set of real ones to PostgreSQL, and adding a fourth replica costs nothing on the
; database side.

[databases]
; The backend's DATABASE_URL points here, not at PostgreSQL. Credentials come from the
; environment at container start; see docker-compose.prod.yml.
helios = host=postgres port=5432 dbname=helios

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Transaction pooling: a server connection is held only for the duration of a transaction
; rather than for the life of the client connection. That is what produces the
; multiplexing, and it comes with a constraint the application has to respect — see below.
pool_mode = transaction

; ---------------------------------------------------------------------------------------
; What transaction pooling forbids, and why this application is compatible
; ---------------------------------------------------------------------------------------
; Session-scoped state does not survive: no session-level advisory locks, no LISTEN/NOTIFY,
; no server-side prepared statements that outlive a transaction, no temporary tables across
; statements, no SET that is expected to persist.
;
; Helios uses none of them. Every database interaction is a short transaction inside one
; request — see app/db/base.py, where a session is opened per request and committed or
; rolled back before the response is returned. The one place a lock is needed, the startup
; retention sweep, takes it in Redis rather than in PostgreSQL, precisely so that this
; remains true.
;
; psycopg 3 is used with its default of unnamed prepared statements, which is what makes it
; safe here. psycopg2's named prepared statements would break under transaction pooling.

; ---------------------------------------------------------------------------------------
; Sizing
; ---------------------------------------------------------------------------------------
; default_pool_size is real connections to PostgreSQL per (database, user) pair. It should
; be sized from measurement rather than from the number of replicas: the load tests in
; loadtest/ report database connection counts for exactly this purpose. 20 is a starting
; point for the three-replica topology, not a derived answer.
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

; Client connections PgBouncer will accept. Comfortably above the fleet's total pool size
; so that a replica restart storm queues rather than erroring.
max_client_conn = 300
max_db_connections = 50

server_idle_timeout = 600
server_lifetime = 3600
; Below PostgreSQL's own idle_in_transaction_session_timeout, so PgBouncer reclaims a
; connection before the database kills it underneath.
idle_transaction_timeout = 60

; A query that runs longer than this is almost certainly a mistake. The long work in this
; application is CPU in Python — model training — not SQL; no legitimate query here reads
; or writes for two minutes.
query_timeout = 120
query_wait_timeout = 30

; ---------------------------------------------------------------------------------------
; Operations
; ---------------------------------------------------------------------------------------
; SHOW POOLS / SHOW STATS on the internal network only. `stats` can read but not manage.
admin_users = helios_admin
stats_users = helios_stats

log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60

; Nothing is stored on disk; the container is disposable like the backends.
ignore_startup_parameters = extra_float_digits,options
