# The Helios server block.
#
# One origin serves both surfaces: `/api/*` goes to the backend cluster and everything else
# to the frontend cluster. That is not merely tidy — it is what makes the refresh cookie
# work. The cookie is `SameSite=Lax`, so a browser withholds it from cross-site requests,
# and splitting the app and the API across two origins would silently break silent refresh:
# everything works until an access token expires, at which point the user is signed out
# with no explanation.

# Forwarded headers, set once and reused by every location.
#
# X-Forwarded-For is appended to rather than replaced, so the chain is preserved. The
# backend counts trusted hops from the right-hand end (SOLAR_TRUSTED_PROXY_HOPS=1 for this
# topology) precisely because a client can put anything it likes at the left.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

proxy_http_version 1.1;
proxy_set_header Connection "";

# Do not serve a stale or partial response from a failed upstream, and do not retry a
# non-idempotent request against a second backend — a POST /api/estimate that timed out may
# well have completed.
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;

server {
    listen 80;
    server_name _;

    # In production this block redirects to HTTPS and a TLS block below serves the site.
    # It is left plain here because compose has no certificate; see docs/DEPLOYMENT.md for
    # the TLS server block and where the certificates come from.

    # ----------------------------------------------------------------------------------
    # Security headers
    # ----------------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "camera=(), microphone=(), payment=(), geolocation=(self)" always;
    # HSTS belongs on the TLS listener, not here: sending it from a plaintext port would
    # pin browsers to HTTPS for a host that is not yet serving it.

    limit_conn perip 24;

    # ----------------------------------------------------------------------------------
    # Health
    # ----------------------------------------------------------------------------------
    # The load balancer's own liveness, answered without touching an upstream. An external
    # checker asking "is the LB up?" must not get a 502 because a backend is restarting.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ----------------------------------------------------------------------------------
    # Authentication
    # ----------------------------------------------------------------------------------
    # Matched before the general /api/ block, and limited far harder. These endpoints mint
    # credentials and send mail, so the threat is credential stuffing and mailbox flooding
    # rather than resource exhaustion.
    location /api/auth/ {
        limit_req zone=api_auth burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://helios_backend;
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # ----------------------------------------------------------------------------------
    # The API
    # ----------------------------------------------------------------------------------
    location /api/ {
        limit_req zone=api_general burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://helios_backend;

        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;

        # 300 seconds, and this number is load-bearing.
        #
        # The analysis console trains and cross-validates a model inside the request. That
        # runs for roughly 10–40 seconds normally, and a model comparison across several
        # algorithms over a long period legitimately takes minutes. Nginx's 60-second
        # default would kill those requests part-way through — the work would complete on
        # the backend and the user would see a 504, which is the worst of both.
        proxy_read_timeout    300s;

        # Streaming is off: these responses are JSON documents assembled in full, and
        # buffering lets Nginx free the upstream connection as soon as the backend is done.
        proxy_buffering on;
        proxy_buffers 16 32k;
        proxy_busy_buffers_size 64k;
    }

    # Metrics are not published. They are a detailed map of the deployment, and Prometheus
    # scrapes the backends directly on the internal network.
    location = /api/metrics {
        deny all;
        return 404;
    }

    # ----------------------------------------------------------------------------------
    # The application
    # ----------------------------------------------------------------------------------
    # Immutable build assets. The filename contains a content hash, so a year is safe and
    # anything shorter is throwing away cache hits for no benefit.
    location /_next/static/ {
        proxy_pass http://helios_frontend;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://helios_frontend;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
