# Nginx — the entry point in front of the backend and frontend fleets.
#
# The image is pinned to an exact version in compose. `nginx:latest` would mean the load
# balancer version changes underneath a deployment nobody intended to change.

user  nginx;
# One worker per core, each handling many connections. Nginx is not the bottleneck here —
# a solar estimate takes seconds of Python — but it must not become one under a burst.
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ----------------------------------------------------------------------------------
    # Logging
    # ----------------------------------------------------------------------------------
    # JSON, so the aggregator indexes fields rather than parsing a sentence, and carrying
    # the same request id the backend stamps on its own logs. That id is what joins an
    # entry here to the backend line that produced it — without it, correlating a slow
    # request across the two is guesswork.
    log_format json_combined escape=json
      '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_id":"$upstream_http_x_request_id",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"duration_s":$request_time,'
        '"upstream":"$upstream_addr",'
        '"upstream_time":"$upstream_response_time",'
        '"upstream_status":"$upstream_status",'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent"'
      '}';

    access_log  /var/log/nginx/access.log  json_combined;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Do not advertise the exact version to every visitor.
    server_tokens   off;

    # A generous body limit: the console accepts an uploaded series.
    client_max_body_size 10m;
    client_body_timeout  60s;
    client_header_timeout 20s;

    # ----------------------------------------------------------------------------------
    # Compression
    # ----------------------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/javascript
                      application/javascript application/json
                      application/xml image/svg+xml;

    # ----------------------------------------------------------------------------------
    # Rate limiting at the edge
    # ----------------------------------------------------------------------------------
    # This is a coarse second line, not the real limiter. The application's limits live in
    # Redis and are shared across every replica, which is what makes them meaningful; these
    # exist to shed a flood before it reaches Python at all, because a request that gets as
    # far as the estimate engine has already cost real CPU.
    limit_req_zone $binary_remote_addr zone=api_general:16m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:8m     rate=2r/s;
    limit_conn_zone $binary_remote_addr zone=perip:8m;

    # ----------------------------------------------------------------------------------
    # Upstreams
    # ----------------------------------------------------------------------------------
    upstream helios_backend {
        # least_conn rather than round-robin, and that choice matters here more than it
        # usually does. Request cost on this backend spans three orders of magnitude: a
        # cached estimate returns in milliseconds, a console model comparison runs for
        # tens of seconds. Round-robin would keep handing new work to an instance already
        # holding a long training run; least_conn sends it to whichever instance is
        # actually free.
        least_conn;

        server backend1:8000 max_fails=3 fail_timeout=30s;
        server backend2:8000 max_fails=3 fail_timeout=30s;
        server backend3:8000 max_fails=3 fail_timeout=30s;

        # Reuse upstream connections. Without this every proxied request opens a new TCP
        # connection to a backend, which at any real request rate is a large amount of
        # avoidable handshaking and a steady supply of sockets in TIME_WAIT.
        keepalive 32;
    }

    upstream helios_frontend {
        least_conn;
        server frontend1:3000 max_fails=3 fail_timeout=30s;
        server frontend2:3000 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    include /etc/nginx/conf.d/*.conf;
}
