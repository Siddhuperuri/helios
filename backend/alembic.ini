; Alembic configuration.
;
; The database URL is deliberately absent from this file. It is read from the environment
; by alembic/env.py, through the same app.config.Settings the application uses, so that a
; migration can never be applied to a different database than the one the process it is
; migrating for will open.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
; Migration files are named <revision>_<slug>.py with a sortable timestamp prefix, so a
; directory listing reads in the order the migrations were written.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
