# Helios — continuous integration.
#
# Every pull request runs the full suite against **real PostgreSQL and real Redis**, not
# against the SQLite and in-process stand-ins the local suite uses. That is the point of
# the service containers below: the cross-instance tests prove that two backend instances
# share state through infrastructure rather than through module globals, and they can only
# prove it against the infrastructure production actually runs.
#
# The pipeline fails on: lint, type errors, any failing test, and a HIGH or CRITICAL
# vulnerability in either image.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes an in-flight run on the same branch. Keeps the queue short and
# stops two runs racing to report on a branch that has already moved on.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # -------------------------------------------------------------------------------------
  # Backend
  # -------------------------------------------------------------------------------------
  backend:
    name: Backend — lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_DB: helios_test
          POSTGRES_USER: helios
          POSTGRES_PASSWORD: helios-test-password
        ports: ["5432:5432"]
        # Without the health check the job races the database and fails intermittently on
        # a cold runner, which is the worst kind of CI failure: real half the time.
        options: >-
          --health-cmd "pg_isready -U helios -d helios_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7.4.1
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: python -m ruff check app tests scripts alembic

      - name: Type check
        working-directory: backend
        # The scientific modules predate type annotations and are excluded rather than
        # annotated hastily — a wrong annotation on the solar engine would be worse than
        # none. Everything added by the production-readiness work is checked.
        run: python -m mypy app --ignore-missing-imports

      - name: Verify migrations match the models
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://helios:helios-test-password@localhost:5432/helios_test
        run: |
          python -m alembic upgrade head
          # Autogenerate against a database that is already at head must produce an empty
          # migration. Anything else means a model changed without a migration, which would
          # deploy fine and then fail on the first query.
          python -m alembic revision --autogenerate -m "ci drift check" >/dev/null
          if grep -qE "op\.(create|drop|alter|add)" alembic/versions/*ci_drift_check.py; then
            echo "::error::The models and the migrations disagree. Run 'make migration m=\"...\"' and commit the result."
            cat alembic/versions/*ci_drift_check.py
            exit 1
          fi
          rm -f alembic/versions/*ci_drift_check.py

      - name: Test — against real PostgreSQL and Redis
        working-directory: backend
        env:
          # These are what make the cross-instance tests meaningful. Without them the suite
          # runs against SQLite and an in-process Redis stand-in, which exercises the code
          # paths but not the engines.
          HELIOS_TEST_DATABASE_URL: postgresql+psycopg://helios:helios-test-password@localhost:5432/helios_test
          HELIOS_TEST_REDIS_URL: redis://localhost:6379/1
        run: python -m pytest -q --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  # -------------------------------------------------------------------------------------
  # Backend — the fallback path
  # -------------------------------------------------------------------------------------
  backend-standalone:
    name: Backend — no services (the laptop path)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # A developer with nothing installed must be able to run the suite, and that promise
      # rots silently unless something checks it. This job is that check.
      - name: Test — SQLite and the in-process Redis stand-in
        working-directory: backend
        run: python -m pytest -q

  # -------------------------------------------------------------------------------------
  # Frontend
  # -------------------------------------------------------------------------------------
  frontend:
    name: Frontend — types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      # No frontend lint step, deliberately. This project has never had an ESLint config
      # or an ESLint dependency — `package.json` carries a `lint` script that has nothing
      # to run, so `next lint` drops into its interactive setup prompt and would hang the
      # job. The frontend's real gates are the two below: the type checker and the tests.
      # Adding ESLint would be a new dependency and a new rule set applied retroactively
      # to existing code, which is a separate decision from this pipeline.

      - name: Test
        working-directory: frontend
        run: npx vitest run

      - name: Build
        working-directory: frontend
        env:
          # Empty means same-origin, which is how the deployed topology works.
          NEXT_PUBLIC_API_BASE: ""
        run: npm run build

  # -------------------------------------------------------------------------------------
  # Images
  # -------------------------------------------------------------------------------------
  images:
    name: Build and scan images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: helios-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: helios-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: helios-backend:ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          # A vulnerability with no available fix cannot be actioned by this pipeline, and
          # failing on it would teach everyone to ignore the job. They are still reported
          # by the scheduled scan below, which is where they get triaged.
          ignore-unfixed: true

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: helios-frontend:ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Verify the stack starts and reports ready
        run: |
          # A smoke test, not a load test: does the composed stack come up, run its
          # migrations, and does a backend actually report itself ready? That is the
          # difference between "the image builds" and "the image runs".
          docker compose -f docker-compose.yml up -d --wait --wait-timeout 180
          echo "--- readiness ---"
          curl -fsS http://localhost:8000/api/health/ready | tee /dev/stderr | grep -q '"status": *"ready"'
          echo "--- liveness ---"
          curl -fsS http://localhost:8000/api/health/live
          echo "--- the frontend is serving ---"
          curl -fsS -o /dev/null -w '%{http_code}\n' http://localhost:3000/
          docker compose -f docker-compose.yml down -v

  # -------------------------------------------------------------------------------------
  # Secrets
  # -------------------------------------------------------------------------------------
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks needs history to scan the commits in the pull request, not just the
          # final tree. A secret that was committed and then removed is still leaked.
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
